<!doctype html>
<html lang="en">
    <head>
        <title id="title">MiroTalk SFU - RTCStats Viewer</title>
        <link id="icon" rel="shortcut icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/pwa/apple-touch-icon.png" />

        <meta charset="utf-8" />
        <meta name="robots" content="noindex, nofollow" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0f1117" />
        <meta name="color-scheme" content="dark" />
        <meta name="referrer" content="no-referrer" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <!-- uPlot (MIT License) https://github.com/leeoniya/uPlot -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css" />
        <link rel="stylesheet" type="text/css" href="../css/RtcStatsViewer.css" />
    </head>
    <body>
        <div id="loadingBar" class="loading-bar" role="progressbar" aria-label="Loading dump" hidden></div>
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <i class="fa-solid fa-chart-line"></i>
                    <div>
                        <h1>RTCStats Viewer</h1>
                        <div class="subtitle">Understand what happened on a call</div>
                    </div>
                </div>
                <div>
                    <label class="btn" for="fileInput" title="Open a local RTCStats or webrtc-internals dump">
                        <i class="fa-solid fa-folder-open"></i> <span class="btn-label">Open file</span>
                    </label>
                    <input type="file" id="fileInput" hidden />
                </div>
            </div>

            <div id="viewerNotice" class="notice error" role="alert" hidden></div>

            <!-- Library: server dumps + local files -->
            <div id="libraryView">
                <section class="card" id="serverSection">
                    <div class="card-head">
                        <h2 class="card-title"><i class="fa-solid fa-server"></i> Server dumps</h2>
                        <div class="card-actions" id="listActions" hidden>
                            <span class="muted small" id="lastUpdated" aria-live="polite"></span>
                            <label class="switch" title="Reload the list every 10 seconds">
                                <input type="checkbox" id="autoRefresh" checked />
                                <span class="slider"></span>
                                Auto-refresh
                            </label>
                            <button id="refreshBtn" class="btn" title="Reload the dump list" aria-label="Refresh">
                                <i class="fa-solid fa-arrows-rotate"></i> <span class="btn-label">Refresh</span>
                            </button>
                            <button
                                id="deleteAllBtn"
                                class="btn danger"
                                title="Delete all finished dumps"
                                aria-label="Delete all"
                                hidden
                            >
                                <i class="fa-solid fa-trash-can"></i> <span class="btn-label">Delete all</span>
                            </button>
                        </div>
                    </div>
                    <form id="authForm" class="auth-form" autocomplete="off">
                        <p class="hint auth-hint">
                            Enter the server API key to browse the dumps collected by this server. No key? You can still
                            open a dump saved on this device below.
                        </p>
                        <div class="password-field">
                            <input
                                type="password"
                                id="apiKeyInput"
                                placeholder="API key (API_KEY_SECRET)"
                                aria-label="API key"
                                autocapitalize="off"
                                spellcheck="false"
                                required
                            />
                            <button
                                type="button"
                                id="toggleKeyBtn"
                                class="reveal-btn"
                                title="Show the API key"
                                aria-label="Show the API key"
                                aria-pressed="false"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn primary"><i class="fa-solid fa-key"></i> Connect</button>
                    </form>
                    <div id="dumpsPanel" hidden>
                        <div class="toolbar">
                            <input
                                type="search"
                                class="grow"
                                id="dumpSearch"
                                placeholder="Filter by room, participant, tag, file..."
                            />
                            <span class="muted" id="dumpCount" aria-live="polite"></span>
                            <button id="logoutBtn" class="btn icon" title="Forget the API key" aria-label="Sign out">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                        <div class="table-wrap dumps-wrap">
                            <table class="dumps-table">
                                <thead>
                                    <tr>
                                        <th>Started</th>
                                        <th>Room</th>
                                        <th>Participant</th>
                                        <th>Tags</th>
                                        <th>Duration</th>
                                        <th>Size</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="dumpsBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div id="serverNotice" class="notice" hidden></div>
                </section>

                <label id="dropZone" class="drop-zone" for="fileInput" tabindex="0">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span class="drop-title">
                        <span class="for-pointer">Drop a dump here or <u>browse</u></span>
                        <span class="for-touch">Tap to open a dump from this device</span>
                    </span>
                    <span class="drop-sub"
                        >RTCStats or chrome://webrtc-internals dump · read locally, nothing is uploaded</span
                    >
                </label>
            </div>

            <!-- Analysis of one dump -->
            <section id="analysisView" hidden>
                <div class="breadcrumb">
                    <button id="backBtn" class="btn" title="Back to all dumps" aria-label="Back to all dumps">
                        <i class="fa-solid fa-arrow-left"></i> <span class="btn-label">All dumps</span>
                    </button>
                    <span class="crumb-name mono" id="dumpName"></span>
                    <button
                        id="analyzeBtn"
                        class="btn"
                        title="Download this dump and open an external service for an in-depth analysis"
                        hidden
                    >
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> <span id="analyzeLabel"></span>
                    </button>
                    <button id="downloadBtn" class="btn icon" title="Download this dump" aria-label="Download" hidden>
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
                <nav class="tabs" id="tabs" role="tablist" aria-label="Analysis sections"></nav>
                <div id="tabContent" role="tabpanel"></div>
            </section>
        </div>

        <script defer src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
        <script defer src="../sfu/RtcStatsShared.js"></script>
        <script defer src="../js/RtcStatsAnalyzer.js"></script>
        <script defer src="../js/RtcStatsViewer.js"></script>
    </body>
</html>
