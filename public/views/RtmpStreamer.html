<!doctype html>
<html lang="en">
    <head>
        <!-- Title and Icon -->

        <title id="title">MiroTalk RTMP Streamer</title>
        <link id="icon" rel="shortcut icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- The page URL carries a session token: never send it to third parties -->
        <meta name="referrer" content="no-referrer" />

        <meta
            id="description"
            name="description"
            content="MiroTalk SFU powered by WebRTC and mediasoup, Real-time Simple Secure Fast video calls, messaging and screen sharing capabilities in the browser."
        />

        <!-- StyleSheet -->

        <link rel="stylesheet" href="../css/Root.css" />
        <link rel="stylesheet" href="../css/RtmpStreamer.css" />

        <!-- https://cdnjs.com/libraries/font-awesome -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

        <!-- Axios -->

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script defer src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- JS scripts -->
        <script defer src="../js/Brand.js"></script>
        <script async src="../js/Translate.js"></script>
        <script defer src="../js/RtmpStreamer.js"></script>
    </head>
    <body>
        <div id="popup" class="popup hidden" role="status" aria-live="polite" aria-atomic="true">
            <span class="popup-icon" aria-hidden="true">
                <i id="popupIcon" class="fas fa-circle-info"></i>
            </span>
            <span class="popup-content">
                <strong id="popupTitle">Notice</strong>
                <span id="popupMessage"></span>
            </span>
            <button id="closePopup" type="button" aria-label="Dismiss notification" title="Dismiss">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
            <span class="popup-progress" aria-hidden="true"></span>
        </div>
        <header class="streamer-header fadein">
            <a class="brand" href="/" aria-label="MiroTalk SFU home">
                <img src="../images/logo.svg" alt="" width="34" height="34" />
                <span>MiroTalk SFU</span>
            </a>
            <div class="header-status" aria-label="RTMP broadcast studio">
                <span class="status-dot" aria-hidden="true"></span>
                Broadcast studio
            </div>
        </header>

        <main class="container fadein">
            <section class="preview-panel" aria-labelledby="streamerTitle">
                <div class="preview-heading">
                    <div>
                        <p class="eyebrow">Live output</p>
                        <h1 id="streamerTitle">RTMP Streamer</h1>
                    </div>
                    <span class="preview-status"><span aria-hidden="true"></span> Ready</span>
                </div>

                <div class="video-frame">
                    <video id="video" width="1280" height="720" aria-label="Live stream preview"></video>
                    <div class="video-placeholder" aria-hidden="true">
                        <i class="fas fa-video"></i>
                        <strong>Your preview will appear here</strong>
                        <span>Choose camera or screen to begin</span>
                    </div>
                </div>
            </section>

            <aside class="control-panel" aria-label="Stream controls">
                <div class="control-intro">
                    <span class="control-step">01</span>
                    <div>
                        <h2>Connect</h2>
                        <p>Authorize and prepare your RTMP destination.</p>
                    </div>
                </div>

                <div class="input-group-inline field-group">
                    <label for="apiSecret">API secret</label>
                    <div class="input-shell">
                        <i class="fas fa-key" aria-hidden="true"></i>
                        <input
                            id="apiSecret"
                            type="password"
                            value=""
                            placeholder="Enter API secret"
                            autocomplete="off"
                            title="Enter the API secret here"
                        />
                    </div>
                </div>

                <div class="input-group-inline field-group destination-group">
                    <label for="rtmp">RTMP destination</label>
                    <div class="destination-row">
                        <div class="input-shell">
                            <i class="fas fa-tower-broadcast" aria-hidden="true"></i>
                            <input
                                id="rtmp"
                                type="text"
                                value=""
                                placeholder="Generated when streaming starts"
                                readonly
                                title="This is your RTMP live URL. It cannot be edited."
                            />
                        </div>
                        <button
                            id="copy"
                            class="icon-button"
                            type="button"
                            aria-label="Copy RTMP URL"
                            title="Copy RTMP URL"
                        >
                            <i class="fas fa-copy" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="control-divider" role="presentation"></div>

                <div class="control-intro">
                    <span class="control-step">02</span>
                    <div>
                        <h2>Choose a source</h2>
                        <p>Broadcast your camera or share your screen.</p>
                    </div>
                </div>

                <div class="button-group">
                    <button id="startCamera" class="source-button" type="button" title="Start camera streaming">
                        <span class="button-icon"><i class="fas fa-video" aria-hidden="true"></i></span>
                        <span><strong>Camera</strong><small>Video and microphone</small></span>
                        <i class="fas fa-chevron-right button-arrow" aria-hidden="true"></i>
                    </button>
                    <button id="startScreen" class="source-button" type="button" title="Start screen streaming">
                        <span class="button-icon"><i class="fas fa-display" aria-hidden="true"></i></span>
                        <span><strong>Screen</strong><small>Display and system audio</small></span>
                        <i class="fas fa-chevron-right button-arrow" aria-hidden="true"></i>
                    </button>
                    <button id="stop" class="stop-button" type="button" disabled title="Stop streaming">
                        <i class="fas fa-stop" aria-hidden="true"></i>
                        Stop broadcast
                    </button>
                </div>
            </aside>
        </main>
        <footer id="footer">
            <p>&copy; 2026 MiroTalk SFU</p>
        </footer>
    </body>
</html>
